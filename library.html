<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.5;
      color: #222;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    nav {
      display: flex;
      gap: 16px;
      width: 100%;
    }
    nav a {
      color: #0b57d0;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .hidden {
      display: none;
    }
    .highlight {
      background-color: #fff3cd;
    }
    .top {
      font-weight: bold;
      color: #b45309;
    }
    section {
      margin-bottom: 28px;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    input, select, button {
      padding: 6px 10px;
      font: inherit;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      text-align: left;
    }
    th[data-sort] {
      cursor: pointer;
      user-select: none;
    }
    th[data-sort]:hover {
      background: #f3f4f6;
    }
    footer {
      border-top: 1px solid #ddd;
      padding-top: 12px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
  <script src="data.js" defer></script>
  <script src="library.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Библиотека колледжа</h1>
    <div id="auth">
      <button id="login-btn" type="button">Войти</button>
    </div>
    <nav>
      <a href="#catalog">Каталог</a>
      <a href="#my">Мои книги</a>
      <a href="#add-section">Добавить книгу</a>
    </nav>
  </header>

  <main>
    <form id="login" class="hidden">
      <input type="text" name="username" placeholder="Логин" required>
      <input type="password" name="password" placeholder="Пароль" required>
      <button type="submit">Войти</button>
    </form>

    <section id="catalog">
      <h2>Каталог</h2>
      <form id="search-form">
        <input type="search" id="q" name="q" placeholder="Поиск по названию или автору...">
        <select id="genre" name="genre">
          <option value="">Любой жанр</option>
          <option value="Роман">Роман</option>
          <option value="Повесть">Повесть</option>
          <option value="Фантастика">Фантастика</option>
        </select>
        <button type="submit">Найти</button>
      </form>

      <table id="books">
        <thead>
          <tr>
            <th data-sort="title">Название</th>
            <th data-sort="author">Автор</th>
            <th data-sort="genre">Жанр</th>
            <th data-sort="year">Год</th>
            <th data-sort="rating">Рейтинг</th>
            <th>Действие</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="my">
      <h2>Мои книги</h2>
      <ul id="my-list"></ul>
    </section>

    <section id="add-section">
      <h2>Добавить книгу</h2>
      <form id="add-form">
        <input type="text" name="title" placeholder="Название" required>
        <input type="text" name="author" placeholder="Автор" required>
        <select name="genre" required>
          <option value="">Выберите жанр</option>
          <option value="Роман">Роман</option>
          <option value="Повесть">Повесть</option>
          <option value="Фантастика">Фантастика</option>
        </select>
        <input type="number" name="year" placeholder="Год" required>
        <input type="number" name="rating" step="0.1" min="0" max="5" placeholder="Рейтинг">
        <button type="submit">Добавить</button>
      </form>
    </section>
  </main>

  <footer>© 2026 Библиотека колледжа</footer>
</body>
</html>
